name: jobbridge_app
description: "JobBridge - job search and recruitment mobile app"
# Prevents accidental publication to pub.dev.
publish_to: 'none'

# versionName / CFBundleShortVersionString + versionCode / CFBundleVersion.
# **This is what a device reports.** `android/app/build.gradle.kts` derives
# `versionName` and `versionCode` from it, so a release tag with this left
# unchanged produces an APK that disagrees with the tag — which is exactly what
# v1.0.1, v1.0.2 and v1.1.1 did. `release-apk.yml` now refuses a tag that does
# not match this line, so the fourth time is a red run instead of a bad APK.
#
# **The build number must always increase.** Android refuses to install an APK
# whose `versionCode` is not higher than the installed one, so two releases
# sharing a number cannot upgrade each other on a device: the install fails, or
# the tester keeps looking at the old app. One build number per release, counted
# from the first — see CHANGELOG.md.
version: 1.4.1+9

environment:
  sdk: ^3.12.2

# NOTE: entries are kept alphabetical to satisfy the sort_pub_dependencies lint.
#
# Version pinning in this file is load-bearing. The chain:
#
#   flutter_test (Flutter 3.44.8) pins meta to exactly 1.18.0
#     -> build_runner >=2.15.2 needs analyzer >=13.3, which needs meta ^1.18.3
#     -> so build_runner must stay <2.15.2, which caps analyzer at 12.x
#     -> so riverpod_generator must stay <4.0.6 (4.0.6+ requires analyzer ^13)
#     -> so riverpod_annotation is 4.0.3 (riverpod_generator 4.0.4 requires it
#        exactly), which holds flutter_riverpod at 3.3.2 rather than 3.4.2
#     -> so riverpod_lint is pinned to 3.1.4 in analysis_options.yaml
#
# Everything therefore sits on analyzer 12.1.0. Revisit the whole block when a
# Flutter release unpins meta; then all of these can move up together.
#
# freezed is deliberately absent for the same reason: no *stable* freezed
# release supports analyzer 12 (3.2.5 caps at <11; the analyzer-12 build is
# still the 3.2.6-dev.1 prerelease). Add it once a stable release supports
# analyzer >=12 and migrate the models then.
dependencies:
  cupertino_icons: ^1.0.8

  # Networking.
  dio: ^5.11.0

  file_picker: 10.3.3
  flutter:
    sdk: flutter

  # i18n. Ships with the SDK, so it is version-locked to Flutter 3.44.8 and
  # carries its own `intl` constraint - see the note on `intl` below.
  flutter_localizations:
    sdk: flutter

  # State management + dependency injection.
  flutter_riverpod: ^3.0.0

  # Token storage. Deliberately NOT shared_preferences: §12.5 requires secrets in
  # platform-backed secure storage (Keystore / Keychain), and shared_preferences
  # is world-readable on a rooted device.
  flutter_secure_storage: ^9.2.4

  # Icons. The design ships a bespoke 24px/1.75-stroke outline set, so the
  # Material icon font cannot express it - paths are rendered as SVG instead.
  flutter_svg: ^2.2.1

  # Navigation.
  go_router: ^17.3.0

  # i18n / formatting.
  #
  # Pinned exactly, and it is load-bearing like the analyzer chain above:
  # flutter_localizations from the Flutter 3.44.8 SDK depends on intl *0.20.2
  # exactly*, so any caret range that admits 0.20.3+ fails version solving
  # outright. Moves only when Flutter moves.
  intl: 0.20.2

  # JSON models.
  json_annotation: ^4.12.0

  # Where a downloaded attachment is written before the OS opens it.
  #
  # Promoted from transitive rather than added: it was already resolved at 2.1.6
  # through file_picker, so this pins nothing new and cannot disturb the analyzer
  # chain below. Only `getTemporaryDirectory` is used, which on Android is
  # `context.getCacheDir()` — the same root the FileProvider in
  # AndroidManifest.xml declares, and app-private.
  path_provider: ^2.1.6

  riverpod_annotation: 4.0.3

  # Non-secret local state: selected locale pre-auth, persisted idempotency keys.
  # Secrets never go here - see flutter_secure_storage above.
  shared_preferences: ^2.5.4

  # Idempotency keys (BR-07). v4 random, generated once per logical action and
  # persisted with it.
  uuid: ^4.5.2

dev_dependencies:
  # Codegen.
  build_runner: ">=2.4.0 <2.15.2"

  flutter_test:
    sdk: flutter

  json_serializable: ^6.13.0

  riverpod_generator: ">=4.0.4 <4.0.6"

  # Strict lint set; swap for flutter_lints if too noisy.
  # riverpod_lint is NOT listed here: since v3 it uses the analyzer's native
  # plugin system and is declared under `plugins:` in analysis_options.yaml.
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # Required by gen-l10n. Without it `flutter gen-l10n` refuses to emit importable
  # sources, and the failure message does not mention l10n.yaml at all.
  generate: true

  fonts:
    # Golos Text is the design's single family for all four interface variants:
    # it covers latin, latin-ext, cyrillic and cyrillic-ext, so Uzbek Latin,
    # Uzbek Cyrillic and Russian render from one font with no vertical-rhythm
    # drift between languages. Bundled rather than fetched at runtime so the
    # app is deterministic offline. Variable weight axis 400-900; see
    # HhTypography for how weights are applied.
    # Licensed under the SIL Open Font License - assets/fonts/OFL.txt.
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText-Variable.ttf
