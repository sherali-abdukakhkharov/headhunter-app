org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is OFF, and it is load-bearing on this
# toolchain - not a tidiness preference.
#
# With it enabled, `:shared_preferences_android:compileDebugKotlin` fails every
# build with "Could not close incremental caches ... class-fq-name-to-source.tab"
# and, underneath it, "Storage for [...] is already registered". The sequence is:
# the Kotlin daemon compile fails, the Build Tools API falls back to in-process
# compilation, and the fallback re-registers the same cache storages the failed
# attempt left registered.
#
# Confirmed NOT caused by the product flavors: the failing task belongs to a
# plugin subproject that has no flavors, and the build fails identically with the
# pre-flavor android/ config. It is also not stale state - the cache directory is
# recreated from scratch each build and still fails, and it survives
# `flutter clean`, deleting android/.gradle, stopping the Gradle daemons and
# killing the Kotlin daemons.
#
# The cost is nil in practice: the only Kotlin in this repo is MainActivity.kt,
# so what stops being incremental is a handful of plugin source files.
#
# Revisit when the Kotlin plugin or Android Studio's bundled JBR moves - the JDK
# here is JBR 25, which is new enough that the Kotlin daemon is the suspect.
kotlin.incremental=false
