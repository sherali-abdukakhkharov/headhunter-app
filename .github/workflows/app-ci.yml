name: app-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated files are committed, so this asserts they are in sync with
      # their sources rather than generating them for the first time.
      - name: Verify generated files are up to date
        run: |
          dart run build_runner build
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build' and commit the result."
            exit 1
          fi

      # Two of the push tests read android/app/google-services.json, which is
      # gitignored and supplied per machine. They skip when it is absent, so a
      # missing secret costs coverage rather than a red run here - the build
      # job below is where its absence is fatal.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set - the Firebase configuration checks in push_test.dart will skip. See docs/NOTIFICATIONS_SETUP.md."
          fi

      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Required since 2026-08-24, when push landed and with it the
      # `com.google.gms.google-services` Gradle plugin. The plugin reads this
      # file at build time and **fails the build without it** - which is the
      # behaviour we want everywhere else, so it is not softened here.
      #
      # The file is gitignored (android/.gitignore): Google does not treat the
      # key inside as a secret, but GitHub's scanner flagged it on 2026-08-07
      # and this repository keeps credential-shaped files out. Same shape as the
      # keystore in release-apk.yml.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON_BASE64. Android cannot be built without android/app/google-services.json - see docs/NOTIFICATIONS_SETUP.md."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      # --flavor is mandatory now that product flavors exist: Gradle no longer
      # has a plain `assembleDebug`, so a bare `flutter build apk` cannot
      # resolve one APK. --dart-define pairs the Dart config with the Gradle
      # variant; they are separate mechanisms and must name the same flavor.
      - run: >
          flutter build apk --debug
          --flavor development
          --dart-define=FLAVOR=development

      - uses: actions/upload-artifact@v4
        with:
          name: app-development-debug-apk
          # The filename carries the flavor: app-development-debug.apk.
          path: build/app/outputs/flutter-apk/app-development-debug.apk
          retention-days: 7

  # Production is what actually ships, and it differs from development in more
  # than a URL: the underscore-prefixed development routes are not registered at
  # all, so a build failure there is invisible to every other job here.
  build-android-production:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Every job gets a fresh runner, so this is restored per job rather than
      # once - the omission here is what turned the first push of 1.11.0 red
      # while `build-android` next door went green.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON_BASE64. Android cannot be built without android/app/google-services.json - see docs/NOTIFICATIONS_SETUP.md."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      # Release, not debug: --obfuscate and tree shaking are where a production
      # build breaks differently from a debug one. It signs with the debug
      # keystore for now - see TODO.md M11, that must change before any upload.
      - run: >
          flutter build apk --release
          --flavor production
          --dart-define=FLAVOR=production
