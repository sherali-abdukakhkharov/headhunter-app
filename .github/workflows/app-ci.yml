name: app-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated files are committed, so this asserts they are in sync with
      # their sources rather than generating them for the first time.
      - name: Verify generated files are up to date
        run: |
          dart run build_runner build
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are stale. Run 'dart run build_runner build' and commit the result."
            exit 1
          fi

      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --flavor is mandatory now that product flavors exist: Gradle no longer
      # has a plain `assembleDebug`, so a bare `flutter build apk` cannot
      # resolve one APK. --dart-define pairs the Dart config with the Gradle
      # variant; they are separate mechanisms and must name the same flavor.
      - run: >
          flutter build apk --debug
          --flavor development
          --dart-define=FLAVOR=development

      - uses: actions/upload-artifact@v4
        with:
          name: app-development-debug-apk
          # The filename carries the flavor: app-development-debug.apk.
          path: build/app/outputs/flutter-apk/app-development-debug.apk
          retention-days: 7

  # Production is what actually ships, and it differs from development in more
  # than a URL: the underscore-prefixed development routes are not registered at
  # all, so a build failure there is invisible to every other job here.
  build-android-production:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Release, not debug: --obfuscate and tree shaking are where a production
      # build breaks differently from a debug one. It signs with the debug
      # keystore for now - see TODO.md M11, that must change before any upload.
      - run: >
          flutter build apk --release
          --flavor production
          --dart-define=FLAVOR=production
