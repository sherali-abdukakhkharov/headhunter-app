# Compiles the iOS app. There is no Mac and no Xcode on the machine this
# project is developed on, so this job is the only thing that ever compiles
# ios/ - the Swift channels in AppDelegate.swift, the Xcode project, the plugin
# packages - before a TestFlight upload does.
#
# Unsigned and in Debug, so it needs no Apple account and no secret: the
# `Copy GoogleService-Info.plist` build phase only warns when the file is
# absent outside Release. A signed Release build is ios-release.yml.
#
# It runs when something that can break the native build changes. A Dart-only
# change cannot, and `flutter analyze` already covers Dart.
#
# iOS was out of scope from 2026-08-05 to 2026-10-12, and this workflow was
# hand-run only for that stretch. It came back with the App Store launch
# (docs/APP_STORE.md).
name: ios-build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-*.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The newest stable Xcode the image has. Apple has accepted only Xcode 26
      # builds since 2026-04-28, so compiling with an older default would check
      # a toolchain the upload would refuse.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # No --flavor: iOS has one target and no Xcode schemes per flavor. The
      # Dart half of the flavor is the define, and production is the only one
      # that ships on iOS.
      - name: Build iOS (no code signing)
        run: >
          flutter build ios --debug --no-codesign
          --dart-define=FLAVOR=production
