# iOS is OUT OF SCOPE (owner direction, 2026-08-05). Do not re-enable without
# being asked for it.
#
# This workflow is kept, not deleted, because the configuration is correct and
# rewriting it later is pure waste - but it no longer runs on push or pull
# request. `workflow_dispatch` means it can still be started by hand from the
# Actions tab if anyone wants to check the iOS target.
#
# Why it would fail if left on: `telegram_login` requires **iOS 15**, and the
# project deliberately stays at the Flutter default of 13.0 because raising it is
# an iOS product decision nobody has asked for. So this job would break on every
# push, and fixing it is exactly the iOS work that is out of scope.
#
# Original purpose, for whoever turns it back on: iOS cannot be built on the
# Windows dev machine (Xcode is macOS-only), so this was the only thing that
# compiled the iOS target. It builds without code signing, which needs no
# certificates - enough to catch iOS-specific compile and plugin breakage.
# Producing an installable .ipa additionally needs an Apple Developer account.
#
# To bring iOS back: raise IPHONEOS_DEPLOYMENT_TARGET to 15.0, restore the
# `push`/`pull_request` triggers below, and see docs/TELEGRAM_LOGIN.md for the
# BotFather registration (bundle id + Apple Team ID) that login needs.
name: ios-build

on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # No --flavor here: iOS flavors are Xcode schemes, which were never
      # created. The Dart half works everywhere, so FLAVOR is passed on its own.
      - name: Build iOS (no code signing)
        run: >
          flutter build ios --debug --no-codesign
          --dart-define=FLAVOR=development
