# Builds a signed production APK and attaches it to a GitHub Release, so the
# latest build is always one click away.
#
# The download link never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/jobbridge.apk
#
# Each release also carries `jobbridge-<version>.apk`, byte-identical, because
# once a file is on a phone the release title and tag are not.
# GitHub resolves `latest` server-side, so README needs no edit per release.
#
# `headhunter.apk` was uploaded beside it as a byte-identical alias from the 1.1.0
# rename until 2026-08-28, because that URL was already in circulation. Twenty-two
# releases have carried both names and every link this repository owns now says
# `jobbridge.apk`, so the alias has done its job. A link nobody has updated in
# twenty-two releases is one nobody is following.
#
# Trigger: push a version tag.
#   git tag v1.0.1 && git push origin v1.0.1
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get an APK
# without cutting a release - useful for handing a build to someone mid-sprint.
name: release-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Override the API base URL for this build only'
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

permissions:
  # Needed to create the release and upload the APK to it. Nothing else.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the version guard below compares this build number
      # against the previous tag's, which a shallow checkout cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version in pubspec.yaml is what the device reports - Gradle derives
      # versionName and versionCode from it - so a tag on its own is not a
      # release. That rule was written in CHANGELOG.md, in pubspec.yaml and in
      # README.md, and *three of the first four releases broke it anyway*: v1.0.1,
      # v1.0.2 and v1.1.1 all shipped reporting an earlier version, v1.1.1 while
      # reusing v1.1.0's build number, which is what stops a phone from taking it
      # as an upgrade at all.
      #
      # A document nobody re-reads at the moment of tagging cannot enforce
      # anything. This can: it is the first step, so a mismatch costs twenty
      # seconds and no published artifact.
      #
      # **Both halves are checked** (2026-08-28). The versionName has to equal the
      # tag, and the build number has to be higher than the last released one -
      # which is the half that was left to a reviewer, on the grounds that fetching
      # tags was not worth it. v1.1.1 is the counter-example: it reused v1.1.0's
      # build number, and Android refuses to install an APK whose versionCode did
      # not move, so the tester keeps looking at the old app and reports bugs that
      # were fixed. `fetch-depth: 0` above is what makes the comparison possible.
      #
      # A first release, or a tag whose predecessor has no pubspec, skips the
      # comparison rather than failing: there is nothing to compare against, and a
      # guard that blocks the first release of a repository is a guard nobody keeps.
      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          name=${version%%+*}
          build=${version#*+}
          tag=${GITHUB_REF_NAME#v}
          echo "tag=$tag  pubspec=$version  (versionName=$name, versionCode=$build)"
          if [ "$tag" != "$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME would publish an APK reporting $name (build $build). Bump pubspec.yaml in the same commit as the tag, add a CHANGELOG.md entry, and tag again - see CHANGELOG.md."
            exit 1
          fi

          # **The greatest tag strictly below this one**, not the greatest tag
          # that is not this one. Those differ whenever a later tag already
          # exists, and the difference is not theoretical: v1.25.0 and v1.26.0
          # were pushed together on 2026-08-28, so v1.25.0's run compared its
          # build 35 against v1.26.0's 36, called the number backwards, and
          # refused to build a release that was perfectly correct.
          #
          # Re-running an older tag's build hits the same thing, which is worse
          # - re-run is the button somebody presses when a build failed for an
          # unrelated reason, and it would fail again for a reason that is not
          # about the tag being re-run.
          #
          # Ascending sort, and print whatever came immediately before the
          # current tag. If the current tag is not in the list at all nothing
          # is printed, which lands on the "no earlier tag" branch below rather
          # than silently comparing against the newest.
          previous=$(git tag --list "v*" --sort=v:refname \
            | awk -v cur="$GITHUB_REF_NAME" '$0 == cur { print prev; exit } { prev = $0 }')
          if [ -z "$previous" ]; then
            echo "No earlier tag: nothing to compare the build number against."
            exit 0
          fi

          previous_version=$(git show "$previous:pubspec.yaml" 2>/dev/null | grep -m1 "^version:" | sed "s/^version:[[:space:]]*//")
          if [ -z "$previous_version" ]; then
            echo "::warning::$previous has no readable pubspec.yaml; build number not compared."
            exit 0
          fi

          previous_build=${previous_version#*+}
          echo "previous=$previous ($previous_version), build $previous_build -> $build"
          if [ "$build" -le "$previous_build" ]; then
            echo "::error::Build number $build is not higher than $previous's ($previous_build). Android refuses to install an APK whose versionCode did not move, so this release could not upgrade anyone - it would install as nothing, or the tester would keep reporting bugs that are already fixed. Bump the number after the + in pubspec.yaml."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Fail before the build rather than after it. A missing secret otherwise
      # produces a *debug-signed* release APK, and Gradle's fallback makes that
      # a warning rather than an error - so the run goes green and publishes a
      # file signed with the wrong key. It installs fine on a clean phone, which
      # is what makes it expensive: Android refuses to install an update whose
      # signature differs, so every tester who took the debug-signed build has
      # to uninstall before the next real one will land.
      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing - see docs/RELEASE.md"
            exit 1
          fi

      # Required since 2026-08-24: push added the
      # `com.google.gms.google-services` Gradle plugin, which reads this file
      # at build time and refuses the build without it. Gitignored and supplied
      # per machine, the same way the keystore above is - see
      # docs/NOTIFICATIONS_SETUP.md.
      #
      # A release built without it would have no push at all, so this is
      # checked beside the signing secrets rather than treated as optional.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON_BASE64 - see docs/NOTIFICATIONS_SETUP.md"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # storeFile is resolved relative to android/, matching build.gradle.kts.
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # Resolution order: manual input, then the API_BASE_URL repo variable, then
      # nothing - in which case AppFlavor.production's own default applies.
      - name: Resolve the API base URL
        id: api
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            echo "API base URL: $url"
          else
            echo "::warning::No API_BASE_URL set; using AppFlavor.production's default (https://hh.qitmir.uz)."
          fi

      - name: Build the production APK
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          flutter build apk --release \
            --flavor production \
            --dart-define=FLAVOR=production \
            ${API_URL:+--dart-define=API_BASE_URL=$API_URL}

      # **Two names, and they are not an alias for each other.**
      #
      # `jobbridge-<version>.apk` is what a person downloads. A phone's Downloads
      # folder is where a release loses its identity: four builds called
      # `jobbridge.apk` become `jobbridge (1).apk` upward, and then nobody -
      # least of all an auditor filling in "Application / Build Information" -
      # can say which one they installed. The title and the tag are on the page,
      # not in the file.
      #
      # `jobbridge.apk` stays because `latest/download/<name>` only resolves when
      # the asset name is identical in every release, and that URL is the
      # download button in README.md. Dropping it would break the one link this
      # repository asks people to use.
      #
      # This is a different bargain from the `headhunter.apk` alias removed in
      # 1.24.0. That one existed for URLs printed before the rename and pointed
      # at nothing anybody still needed. Both of these are live: one is how you
      # get the newest build, the other is how you know what you got.
      - name: Stage the artifact
        id: artifact
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')
          name="jobbridge-${version%%+*}.apk"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-production-release.apk "dist/$name"
          # Byte-identical, so which one a tester grabs cannot matter.
          cp "dist/$name" dist/jobbridge.apk

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "dist/$name" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "dist/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Also kept as a build artifact, so a workflow_dispatch run that creates no
      # release still leaves something downloadable. The versioned file only:
      # a CI artifact has no permanent URL to keep working, and an untagged
      # build is exactly the one whose identity is easiest to lose.
      - uses: actions/upload-artifact@v4
        with:
          name: jobbridge-apk
          path: dist/${{ steps.artifact.outputs.name }}
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.artifact.outputs.name }}
            dist/jobbridge.apk
          generate_release_notes: true
          body: |
            ### Download

            **[${{ steps.artifact.outputs.name }}](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.artifact.outputs.name }})** — ${{ steps.artifact.outputs.size }}

            Or always-the-newest:
            [jobbridge.apk](https://github.com/${{ github.repository }}/releases/latest/download/jobbridge.apk).
            The two files are byte-identical; the first one keeps its version in
            the filename, which is what tells four builds in a Downloads folder
            apart.

            Android only. Enable "install from unknown sources" if your phone asks.

            `SHA-256: ${{ steps.artifact.outputs.sha256 }}`

