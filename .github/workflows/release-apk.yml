# Builds a signed production APK and attaches it to a GitHub Release, so the
# latest build is always one click away.
#
# The download link never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/headhunter.apk
# GitHub resolves `latest` server-side, so README needs no edit per release.
#
# Trigger: push a version tag.
#   git tag v1.0.1 && git push origin v1.0.1
#
# Or run it by hand from the Actions tab (workflow_dispatch) to get an APK
# without cutting a release - useful for handing a build to someone mid-sprint.
name: release-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Override the API base URL for this build only'
        required: false
        type: string

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

permissions:
  # Needed to create the release and upload the APK to it. Nothing else.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Fail before the build rather than after it. A missing secret otherwise
      # produces a *debug-signed* release APK that installs happily and then
      # cannot complete a Telegram login, which is a confusing way to lose an
      # afternoon.
      - name: Check signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]   && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing - see docs/RELEASE.md"
            exit 1
          fi

      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # storeFile is resolved relative to android/, matching build.gradle.kts.
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # Resolution order: manual input, then the API_BASE_URL repo variable, then
      # nothing - in which case AppFlavor.production's own default applies.
      - name: Resolve the API base URL
        id: api
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
        run: |
          url="${INPUT_URL:-$VAR_URL}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            echo "API base URL: $url"
          else
            echo "::warning::No API_BASE_URL set; using the production flavor default (https://api.headhunter.uz), which may not exist yet."
          fi

      - name: Build the production APK
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          flutter build apk --release \
            --flavor production \
            --dart-define=FLAVOR=production \
            ${API_URL:+--dart-define=API_BASE_URL=$API_URL}

      # A stable name, deliberately. `latest/download/<name>` only works if the
      # asset name is identical in every release, so the version lives in the
      # release title and tag - not in the filename.
      - name: Stage the artifact
        id: artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-production-release.apk \
             dist/headhunter.apk
          echo "size=$(du -h dist/headhunter.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum dist/headhunter.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Also kept as a build artifact, so a workflow_dispatch run that creates no
      # release still leaves something downloadable.
      - uses: actions/upload-artifact@v4
        with:
          name: headhunter-apk
          path: dist/headhunter.apk
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/headhunter.apk
          generate_release_notes: true
          body: |
            ### Download

            **[headhunter.apk](https://github.com/${{ github.repository }}/releases/latest/download/headhunter.apk)** — ${{ steps.artifact.outputs.size }}

            Android only. Enable "install from unknown sources" if your phone asks.

            `SHA-256: ${{ steps.artifact.outputs.sha256 }}`
